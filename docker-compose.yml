version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:80
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:3001
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
